name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: polybar/polybar
          path: polybar-upstream
      - run: POLYBAR_UPSTREAM=polybar-upstream ./ci.sh
